global: { scrape_interval: 15s, evaluation_interval: 15s }
alerting: { alertmanagers: [{ static_configs: [{ targets: ['alertmanager:9093'] }] }] }
rule_files: [alerts.yml, rules.yml]
scrape_configs:
  - { job_name: app,      static_configs: [{ targets: ['ticket-backend:9464'] }] }
  - { job_name: node,     static_configs: [{ targets: ['node-exporter:9100'] }] }
  - { job_name: cadvisor, static_configs: [{ targets: ['cadvisor:8080'] }] }
  - { job_name: postgres, static_configs: [{ targets: ['postgres-exporter:9187'] }] }
  - { job_name: redis,    static_configs: [{ targets: ['redis-exporter:9121'] }] }
  - job_name: uptime
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets:
          - http://ticket-backend:3000/health/ready
          # - https://YOUR-DOMAIN/health/ready   # public URL: also tests nginx + TLS
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: blackbox:9115 }
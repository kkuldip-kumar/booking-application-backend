name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST (semgrep)
        run: |
          pip install semgrep
          semgrep scan --error --config p/owasp-top-ten --config p/typescript --config p/nodejs src/

      - name: Dependency + config scan (trivy fs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Build image
        run: docker build -f docker/Dockerfile -t app:scan .
      - name: Container scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true